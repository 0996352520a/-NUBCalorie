<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14b8a6">
</head>
<body class="bg-gray-100 text-gray-800 pb-20">

    <!-- หน้าเลือกระบุตัวตน (Login) -->
    <div id="loginScreen" class="p-5 max-w-md mx-auto mt-20 bg-white rounded-xl shadow text-center">
        <h1 class="text-3xl font-bold mb-2 text-teal-600">FitBite</h1>
        <p class="mb-6 text-gray-500">กรุณาพิมพ์ชื่อของคุณเพื่อเข้าใช้งาน<br>(ข้อมูลจะถูกแยกตามชื่อที่พิมพ์)</p>
        <input type="text" id="usernameInput" placeholder="เช่น: พ่อ, แม่, สมชาย" class="border p-3 rounded w-full mb-4 text-center text-lg">
        <button onclick="login()" class="bg-teal-500 text-white w-full py-3 rounded-lg font-bold text-lg">เข้าใช้งาน</button>
    </div>

    <!-- หน้าต่างแอปหลัก (จะซ่อนไว้จนกว่าจะใส่ชื่อ) -->
    <div id="mainApp" class="hidden">
        
        <!-- แถบด้านบน -->
        <div class="bg-teal-500 text-white p-4 flex justify-between items-center shadow-md">
            <span class="text-lg font-bold">FitBite</span>
            <span class="text-sm">ผู้ใช้: <span id="currentUserName" class="font-bold text-yellow-300"></span> <button onclick="logout()" class="ml-3 underline text-gray-200">สลับผู้ใช้</button></span>
        </div>

        <div class="p-4 max-w-md mx-auto">
            <!-- แดชบอร์ดสรุปข้อมูล -->
            <div class="bg-white rounded-xl shadow p-5 mb-5 text-center">
                <h2 class="text-gray-500 text-sm">โควตาแคลอรีวันนี้ (TDEE)</h2>
                <div class="text-4xl font-bold text-teal-600 my-2"><span id="tdeeDisplay">0</span> kcal</div>
                <div class="flex justify-around mt-4 border-t pt-4">
                    <div>
                        <div class="text-xs text-gray-400">กินไปแล้ว</div>
                        <div class="text-xl font-bold text-orange-500"><span id="calDisplay">0</span> kcal</div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-400">BMI ของคุณ</div>
                        <div class="text-xl font-bold text-blue-500" id="bmiDisplay">0.0</div>
                    </div>
                </div>
                <button onclick="resetCalories()" class="mt-4 text-xs text-red-400 underline">รีเซ็ตแคลอรีวันนี้</button>
            </div>

            <!-- ตั้งค่าโปรไฟล์ -->
            <div class="bg-white rounded-xl shadow p-5 mb-5">
                <h2 class="font-bold text-lg mb-3">ข้อมูลส่วนตัว</h2>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <input type="number" id="weight" placeholder="น้ำหนัก (กก.)" class="border p-2 rounded w-full">
                    <input type="number" id="height" placeholder="ส่วนสูง (ซม.)" class="border p-2 rounded w-full">
                    <input type="number" id="age" placeholder="อายุ (ปี)" class="border p-2 rounded w-full">
                    <select id="gender" class="border p-2 rounded w-full">
                        <option value="male">ชาย</option>
                        <option value="female">หญิง</option>
                    </select>
                </div>
                <select id="activity" class="border p-2 rounded w-full mb-3">
                    <option value="1.2">ออกกำลังกายน้อย (นั่งทำงาน)</option>
                    <option value="1.55">ปานกลาง (3-5 วัน/สัปดาห์)</option>
                    <option value="1.725">มาก (ออกกำลังหนักทุกวัน)</option>
                </select>
                <button onclick="saveProfile()" class="bg-teal-500 text-white w-full py-2 rounded-lg font-bold">บันทึก & คำนวณ</button>
            </div>
        </div>

        <!-- ปุ่มกล้องถ่ายรูป -->
        <div class="fixed bottom-5 left-0 w-full flex justify-center px-4">
            <label class="bg-orange-500 text-white px-6 py-3 rounded-full font-bold shadow-lg flex items-center cursor-pointer active:bg-orange-600 w-full max-w-md justify-center">
                📸 ถ่ายภาพอาหารนับแคล
                <input type="file" accept="image/*" capture="environment" id="cameraInput" class="hidden" onchange="analyzeFood(event)">
            </label>
        </div>
    </div>

    <!-- หน้าต่างโหลด -->
    <div id="loading" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-5 rounded-lg text-center">
            <div class="text-xl mb-2">🤖</div>
            <div>AI กำลังวิเคราะห์...</div>
        </div>
    </div>

    <!-- จุดที่แก้ปัญหาการกดไม่ไป: บังคับโหลดไฟล์ใหม่ -->
    <script src="app.js?v=3"></script>
</body>
</html>
