<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NUBCalorie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14b8a6">
</head>
<body class="bg-gray-100 text-gray-800 pb-20">

    <!-- แถบด้านบน: เปลี่ยนชื่อเป็น NUBCalorie -->
    <div class="bg-teal-500 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-10">
        <span class="text-xl font-bold tracking-wide">NUBCalorie</span>
        <div class="flex items-center gap-2">
            <!-- กล่องเลือกชื่อคน -->
            <select id="userSelector" onchange="switchUser()" class="text-gray-800 p-1.5 rounded-md text-sm w-24 font-bold border-none outline-none">
            </select>
            <!-- ปุ่มเพิ่มคน -->
            <button onclick="addNewUser()" class="bg-yellow-400 text-teal-900 px-3 py-1.5 rounded-md text-sm font-bold shadow active:bg-yellow-500">➕ เพิ่มคน</button>
        </div>
    </div>

    <!-- หน้าต่างแอปหลัก -->
    <div id="mainApp" class="p-4 max-w-md mx-auto">
        
        <!-- แดชบอร์ดสรุปข้อมูล -->
        <div class="bg-white rounded-xl shadow p-5 mb-5 text-center relative overflow-hidden">
            <h2 class="text-gray-500 text-sm">โควตาแคลอรีวันนี้ (TDEE)</h2>
            <div class="text-4xl font-bold text-teal-600 my-2"><span id="tdeeDisplay">0</span> kcal</div>
            
            <div class="flex justify-around mt-4 border-t pt-4">
                <div class="flex flex-col items-center">
                    <div class="text-xs text-gray-400">กินไปแล้ว</div>
                    <div class="text-xl font-bold text-orange-500"><span id="calDisplay">0</span> kcal</div>
                    <!-- ปุ่มเปิดดูประวัติ -->
                    <button onclick="openHistory()" class="mt-2 text-xs bg-blue-50 text-blue-600 px-3 py-1 rounded-full border border-blue-200 active:bg-blue-100">📋 ดูประวัติการกิน</button>
                </div>
                <div class="flex flex-col items-center">
                    <div class="text-xs text-gray-400">BMI ของคุณ</div>
                    <div class="text-xl font-bold text-blue-500 mt-1" id="bmiDisplay">0.0</div>
                </div>
            </div>
            
            <button onclick="resetCalories()" class="mt-5 text-xs text-red-400 underline">รีเซ็ตแคลอรีและประวัติวันนี้</button>
        </div>

        <!-- ตั้งค่าโปรไฟล์ -->
        <div class="bg-white rounded-xl shadow p-5 mb-5">
            <h2 class="font-bold text-lg mb-3">ข้อมูลส่วนตัวของ <span id="profileNameDisplay" class="text-teal-600"></span></h2>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <input type="number" id="weight" placeholder="น้ำหนัก (กก.)" class="border p-2 rounded w-full">
                <input type="number" id="height" placeholder="ส่วนสูง (ซม.)" class="border p-2 rounded w-full">
                <input type="number" id="age" placeholder="อายุ (ปี)" class="border p-2 rounded w-full">
                <select id="gender" class="border p-2 rounded w-full bg-white">
                    <option value="male">ชาย</option>
                    <option value="female">หญิง</option>
                </select>
            </div>
            <select id="activity" class="border p-2 rounded w-full mb-4 bg-white">
                <option value="1.2">ออกกำลังกายน้อย (นั่งทำงาน)</option>
                <option value="1.55">ปานกลาง (3-5 วัน/สัปดาห์)</option>
                <option value="1.725">มาก (ออกกำลังหนักทุกวัน)</option>
            </select>
            <button onclick="saveProfile()" class="bg-teal-500 text-white w-full py-3 rounded-lg font-bold shadow-md active:bg-teal-600">💾 บันทึก & คำนวณ</button>
        </div>
    </div>

    <!-- ปุ่มกล้องถ่ายรูป -->
    <div class="fixed bottom-5 left-0 w-full flex justify-center px-4 z-20">
        <label class="bg-orange-500 text-white px-6 py-3 rounded-full font-bold shadow-lg flex items-center cursor-pointer active:bg-orange-600 w-full max-w-md justify-center">
            📸 ถ่ายภาพอาหารนับแคล
            <input type="file" accept="image/*" capture="environment" id="cameraInput" class="hidden" onchange="analyzeFood(event)">
        </label>
    </div>

    <!-- หน้าต่างประวัติการกิน -->
    <div id="historyModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-end justify-center z-40 transition-opacity">
        <div class="bg-white w-full max-w-md rounded-t-2xl p-5 pb-24 shadow-2xl h-3/4 flex flex-col">
            <div class="flex justify-between items-center border-b pb-3 mb-3">
                <h3 class="font-bold text-lg text-teal-700">ประวัติการกินของ <span id="historyName"></span></h3>
                <button onclick="closeHistory()" class="text-gray-500 font-bold text-3xl leading-none">&times;</button>
            </div>
            <ul id="historyList" class="space-y-3 overflow-y-auto flex-1 p-1">
            </ul>
        </div>
    </div>

    <!-- หน้าต่างโหลดโหลด -->
    <div id="loading" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-5 rounded-lg text-center shadow-xl">
            <div class="text-3xl mb-2 animate-bounce">🤖</div>
            <div class="font-bold text-gray-700">AI กำลังวิเคราะห์...</div>
        </div>
    </div>

    <!-- บังคับโหลดไฟล์ใหม่ V6 -->
    <script src="app.js?v=6"></script>
</body>
</html>
